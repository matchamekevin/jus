# ============================================================
# JusTogo — Render Blueprint (render.yaml)
# https://render.com/docs/blueprint-spec
# ============================================================

services:
  # --- Backend API (Node.js) ---
  - type: web
    name: justogo-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: justogo-db
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  # --- PostgreSQL (free 90 jours) ---
  - name: justogo-db
    plan: free
    databaseName: jus_db
    user: jus_user
