version: '3.3'

services:
  postgres:
    image: postgres:15-alpine
    container_name: jus_postgres
    environment:
      POSTGRES_USER: jus_user
      POSTGRES_PASSWORD: jus_password_2026
      POSTGRES_DB: jus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jus_user -d jus_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
